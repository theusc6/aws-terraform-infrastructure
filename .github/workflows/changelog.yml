name: Generate Changelog

on:
  workflow_dispatch: {} # Manual only — auto-generate disabled until action is updated

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Generate Changelog
      uses: saadmk11/changelog-ci@v1.2.0
      with:
        changelog_filename: CHANGELOG.md
