name: Generate Changelog

on:
  push:
    branches:
      - main 

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Generate Changelog
      uses: saadmk11/changelog-ci@v1.1.2
      with:
        changelog_filename: CHANGELOG.md
